<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#09090c" />
    <meta name="description" content="Anilibrix Plus — Премиальный сервис для просмотра аниме онлайн" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Anilibrix+" />
    <meta name="application-name" content="Anilibrix Plus" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Anilibrix Plus — Аниме Онлайн</title>
    <style>
      html, body, #app {
        height: 100%;
        width: 100%;
        margin: 0;
        background: #09090c;
        overflow: hidden;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #09090c;
        z-index: 9999;
        transition: opacity 450ms cubic-bezier(0.25, 1, 0.5, 1), visibility 450ms cubic-bezier(0.25, 1, 0.5, 1);
      }
      #splash.splash--done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash__logo-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash__logo {
        width: 52px;
        height: 52px;
        color: #5e5ce6;
        animation: splashFadeIn 0.8s ease-out;
      }
      .splash__track {
        width: 120px;
        height: 2px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 8px;
      }
      .splash__bar {
        width: 40%;
        height: 100%;
        background: #5e5ce6;
        border-radius: 999px;
        animation: splashSlide 1.5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
      .splash__text {
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: -0.02em;
        animation: splashFadeIn 1s ease-out;
      }
      @keyframes splashFadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes splashSlide {
        0% { transform: translateX(-150%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash__logo-wrap">
        <svg class="splash__logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.8" />
          <path d="M10 8L16 12L10 16V8Z" fill="currentColor" />
        </svg>
      </div>
      <span class="splash__text">Anilibrix+</span>
      <div class="splash__track">
        <div class="splash__bar"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
